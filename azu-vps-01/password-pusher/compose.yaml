services:
  pwpush:
    container_name: password-pusher
    image: pglombardo/pwpush:2.9.7
    restart: unless-stopped
    labels:
      # Traefik
      traefik.enable: true
      traefik.http.routers.password-pusher.entryPoints: websecure
      traefik.http.services.password-pusher.loadbalancer.server.port: 80
      traefik.http.routers.password-pusher.rule: Host(`share.hoebergen.net`)
      # Cloudflare
      dockflare.enable: true
      dockflare.hostname: "share.hoebergen.net"
      dockflare.originsrvname: "share.hoebergen.net"
      dockflare.service: "https://traefik:443"
    volumes:
      - pwpush-storage:/opt/PasswordPusher/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file: .env

# Persists SQLite DB and file uploads. To use a host path instead, replace the
# pwpush-storage service volume with: - /path/on/host:/opt/PasswordPusher/storage
volumes:
  pwpush-storage:
    driver: local

networks:
  default:
    name: frontend
    external: true
