services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: dockflare-docker-socket-proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - IMAGES=1
      - POST=1
      - PING=1
      - INFO=1
      - EXEC=1
      - TZ=Europe/Amsterdam
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-dockflare

  dockflare:
    image: alplat/dockflare:v3.1.6
    container_name: dockflare
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5000:5000"
    volumes:
      - /docker/dockflare/data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_DB_INDEX=0
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - USE_EXTERNAL_CLOUDFLARED=true
      - EXTERNAL_TUNNEL_ID=${EXTERNAL_TUNNEL_ID}
      - TZ=Europe/Amsterdam
    labels:
      traefik.enable: true
      traefik.http.routers.dockflare.entryPoints: websecure
      traefik.http.services.dockflare.loadbalancer.server.port: 5000
      traefik.http.routers.dockflare.rule: Host(`dockflare.hoebergen.net`)
    depends_on:
      docker-socket-proxy:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend-dockflare
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    container_name: dockflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TZ=Europe/Amsterdam
    networks:
      - frontend

  redis:
    image: redis:7-alpine
    container_name: dockflare-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /docker/dockflare/redis:/app/data
    networks:
      - backend-dockflare
    environment:
      - TZ=Europe/Amsterdam

networks:
  backend-dockflare:
    name: backend-dockflare
  frontend:
    name: frontend
    external: true
