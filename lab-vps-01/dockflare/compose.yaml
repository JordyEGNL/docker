services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: dockflare-docker-socket-proxy
    restart: unless-stopped
    logging:
      driver: "none"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - IMAGES=1
      - POST=1
      - PING=1
      - INFO=1
      - EXEC=1
      - TZ=Europe/Amsterdam
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-dockflare

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
  dockflare-init:
    image: alpine:3.24
    command: ["sh", "-c", "chown -R ${DOCKFLARE_UID:-65532}:${DOCKFLARE_GID:-65532}
          /app/data"]
    volumes:
      - /docker/dockflare/data:/app/data
    networks:
      - backend-dockflare
    restart: "no"


    environment:
      - TZ=Europe/Amsterdam
  dockflare:
    image: alplat/dockflare:v3.1.4
    container_name: dockflare
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /docker/dockflare/data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_DB_INDEX=0
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - CLOUDFLARED_NETWORK_NAME=frontend
      - CLOUDFLARED_CONTAINER_NAME=dockflare-cloudflared
      - TZ=Europe/Amsterdam
    labels:
      traefik.enable: true
      traefik.http.routers.dockflare.entryPoints: websecure
      traefik.http.services.dockflare.loadbalancer.server.port: 5000
      traefik.http.routers.dockflare.rule: Host(`dockflare.hoebergen.net`)
    depends_on:
      docker-socket-proxy:
        condition: service_started
      dockflare-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - backend-dockflare
      - frontend

  redis:
    image: redis:7-alpine
    container_name: dockflare-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging:
      driver: "none"
    volumes:
      - /docker/dockflare/redis:/app/data
    networks:
      - backend-dockflare

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    environment:
      - TZ=Europe/Amsterdam
networks:
  backend-dockflare:
    name: backend-dockflare
  frontend:
    name: frontend
    external: true
