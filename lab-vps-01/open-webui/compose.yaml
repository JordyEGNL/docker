services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.11.3-slim
    labels:
      traefik.enable: true
      traefik.http.routers.open-webui.entryPoints: websecure
      traefik.http.services.open-webui.loadbalancer.server.port: 8080
      traefik.http.routers.open-webui.rule: Host(`chat.hoebergen.net`)
    volumes:
      - /docker/open-webui/data:/app/backend/data
    environment:
      ENABLE_FORWARD_USER_INFO_HEADERS: true
      TZ: Europe/Amsterdam
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
    name: frontend
    external: true
