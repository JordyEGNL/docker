services:
  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.traefik-manager.entryPoints: websecure
      traefik.http.services.traefik-manager.loadbalancer.server.port: 5000
      traefik.http.routers.traefik-manager.rule: Host(`traefik.hoebergen.net`)
    environment:
      COOKIE_SECURE: true
      TRAEFIK_INSECURE_SKIP_VERIFY: true
      TZ: Europe/Amsterdam
    volumes:
      - ../traefik/data/fileConfig.yml:/app/config/dynamic.yml
      - ../traefik/data/traefik.yml:/app/traefik.yml
      - ../traefik/data/acme.json:/app/acme.json:ro
      - ./config:/app/config
      - ./backups:/app/backups
      - /var/log/traefik/traefik.log:/var/log/traefik/traefik.log
    networks:
      - frontend

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  frontend:
    name: frontend
    external: true
