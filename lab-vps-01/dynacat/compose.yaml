services:
  dynacat:
    image: panonim/dynacat:3.0.2
    container_name: dynacat
    volumes:
      - /docker/dynacat/config:/app/config
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    dns:
      - "10.0.10.201"
      - "10.0.10.21"
    labels:
      traefik.enable: true
      traefik.http.routers.dynacat.entryPoints: websecure
      traefik.http.services.dynacat.loadbalancer.server.port: 8080
      traefik.http.routers.dynacat.rule: Host(`home.hoebergen.net`)
      traefik.http.routers.dynacat.middlewares: localAccess@file
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Europe/Amsterdam
networks:
  default:
    name: frontend
    external: true
