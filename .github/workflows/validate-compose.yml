name: Validate Docker Compose

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get list of files to check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # In GitHub Actions pull_request workflows, HEAD is a merge commit (refs/pull/<pr>/merge).
            # HEAD^1 is the target branch (base) and HEAD^2 is the PR branch.
            # Comparing HEAD^1 and HEAD gives the exact changes in the PR without relying on shallow remote branches.
            if git rev-parse --verify HEAD^1 >/dev/null 2>&1 && git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              echo "Detected PR merge commit. Diffing base (HEAD^1) against PR merge (HEAD)..."
              CHANGED_FILES=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
            else
              echo "Fetching base branch origin/${{ github.base_ref }} without depth limit..."
              git fetch origin "${{ github.base_ref }}"
              CHANGED_FILES=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}"...HEAD || git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}" HEAD)
            fi
          else
            echo "Non-PR event (${{ github.event_name }}), scanning entire repository..."
            CHANGED_FILES=$(find . -type f -not -path "*/.*/*" | sed 's|^\./||')
          fi

          echo "$CHANGED_FILES" > changed_files.txt
          echo "Files to evaluate:"
          cat changed_files.txt

      - name: Check for deprecated docker-compose filenames
        run: |
          echo "Checking for deprecated docker-compose filenames..."
          LEGACY_FILES=$(grep -E '(^|/)docker-compose\.ya?ml$' changed_files.txt || true)
          if [ -n "$LEGACY_FILES" ]; then
            echo "::error::Deprecated docker-compose file(s) found! Use 'compose.yaml' instead."
            echo "Offending files:"
            echo "$LEGACY_FILES"
            exit 1
          fi
          echo "No deprecated docker-compose files found."

      - name: Validate compose.yaml files
        run: |
          COMPOSE_FILES=$(grep -E '(^|/)compose\.ya?ml$' changed_files.txt || true)
          if [ -z "$COMPOSE_FILES" ]; then
            echo "No compose.yaml files were modified in this run."
            exit 0
          fi

          echo "Validating compose.yaml files..."
          FAILED=0
          TOTAL=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            TOTAL=$((TOTAL + 1))
            echo "Checking: $file"

            if [ ! -f "$file" ]; then
              echo "  Skipping (file not found): $file"
              continue
            fi

            if OUTPUT=$(docker compose -f "$file" config -q --no-interpolate --no-env-resolution --no-path-resolution 2>&1); then
              echo "  OK: $file"
            else
              echo "::error file=$file::Docker Compose validation failed for $file"
              echo "$OUTPUT"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$COMPOSE_FILES"

          echo "=========================================="
          echo "Validated $TOTAL compose.yaml file(s)."
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED compose.yaml file(s) failed validation."
            exit 1
          fi
          echo "All checked compose.yaml files are valid!"