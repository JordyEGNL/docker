services:
  docker-socket-proxy:
    container_name: dockflare-docker-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - IMAGES=1
      - POST=1
      - PING=1
      - EXEC=1
      - TZ=Europe/Amsterdam
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend-dockflare


  dockflare-agent:
    container_name: dockflare-agent
    hostname: dockflare-agent
    image: alplat/dockflare-agent:v3.1.6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - DOCKER_HOST=${DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - USE_EXTERNAL_CLOUDFLARED=true
      - EXTERNAL_TUNNEL_ID=${EXTERNAL_TUNNEL_ID}
    volumes:
      - /docker/dockflare/data:/app/data
    depends_on:
      - docker-socket-proxy
    networks:
      - frontend
      - backend-dockflare

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: dockflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - frontend


networks:
  backend-dockflare:
    name: backend-dockflare
  frontend:
    name: frontend
    external: true
