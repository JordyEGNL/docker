services:
  pulse:
    image: rcourtman/pulse:6.6.0
    container_name: pulse
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: true
      traefik.http.routers.pulse.entryPoints: websecure
      traefik.http.services.pulse.loadbalancer.server.port: 7655
      traefik.http.routers.pulse.rule: Host(`pulse.hoebergen.net`)
    volumes:
      - /docker/pulse/data:/data
      # Temperature monitoring: install pulse-agent on each Proxmox host with --enable-proxmox, or use SSH (see docs/TEMPERATURE_MONITORING.md).
    environment:
      - TZ=Europe/Amsterdam
      - PULSE_DEPLOYMENT_METHOD=docker_compose
    healthcheck:
      test: ["CMD-SHELL", "[ -x /docker-healthcheck.sh ] && /docker-healthcheck.sh || wget --quiet --tries=1 --spider http://localhost:7655/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: frontend
    external: true
